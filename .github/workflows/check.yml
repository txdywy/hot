name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request stops the older run, so only the latest
# commit is tested and an outdated run never reports a failure.
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Chromium is the engine behind Android Chrome, HarmonyOS browsers and
  # WeChat on Android.
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Asset versions and script syntax
        run: node tools/check-assets.mjs
      - name: Install Playwright and the syntax checker
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1 acorn@8.14.0
          npx playwright install --with-deps chromium
      - name: Syntax older phones understand (iOS 12, older Android browsers)
        run: node tools/old-syntax.mjs
      - name: Whole flow on Android, HarmonyOS, iPhone, WeChat and a computer
        if: always()
        run: node tools/smoke.mjs
        env:
          SHOT_DIR: screenshots/smoke
      - name: Every screen size, also with large text
        if: always()
        run: node tools/layout.mjs
        env:
          SHOT_DIR: screenshots/layout
      - name: Bad files, HEIC, dragging the photo, stuck share sheet, Back button
        if: always()
        run: node tools/edges.mjs
        env:
          SHOT_DIR: screenshots/edges
      - name: Keep the screenshots for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chromium-screenshots
          path: screenshots
          retention-days: 14
          if-no-files-found: ignore

  # WebKit is the engine behind iPhone and iPad Safari and iPhone WeChat. It runs in
  # Playwright's own image, which already holds WebKit and its system libraries, so
  # the job never waits on a slow Ubuntu package mirror.
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.49.1-noble
    env:
      ENGINE: webkit
    steps:
      - uses: actions/checkout@v7
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.49.1
      - name: Whole flow on iPhone Safari, iPhone WeChat and a computer
        if: always()
        run: node tools/smoke.mjs
        env:
          SHOT_DIR: screenshots/smoke
      - name: Every screen size, also with large text
        if: always()
        run: node tools/layout.mjs
        env:
          SHOT_DIR: screenshots/layout
      - name: Bad files, dragging the photo, stuck share sheet, Back button
        if: always()
        run: node tools/edges.mjs
        env:
          SHOT_DIR: screenshots/edges
      - name: Keep the screenshots for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webkit-screenshots
          path: screenshots
          retention-days: 14
          if-no-files-found: ignore
