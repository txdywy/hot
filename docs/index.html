<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self'; img-src 'self' blob: data:">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0c0b">
  <meta name="description" content="HOT 主场相框：把主队的颜色、你的名字和号码印在照片上。照片只在浏览器里处理。">
  <title>HOT 主场相框 · 设计稿</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/style.css?v=1">
  <script type="module" src="./assets/app.js?v=1"></script>
</head>
<body>
  <header class="top">
    <div class="shell top-inner">
      <a class="brand" href="#" aria-label="HOT 主场相框">
        <span class="wordmark">HOT</span>
        <span class="brand-sub">主场相框</span>
      </a>
      <span class="draft">设计稿 v0</span>
    </div>
  </header>

  <main class="shell workspace">
    <section class="stage" aria-label="预览">
      <div class="stage-inner">
        <canvas id="preview" aria-label="相框预览"></canvas>
      </div>
      <p class="stage-note" id="stage-note">示意照片。选一张你自己的，效果更直观。</p>
    </section>

    <section class="panel" aria-label="设计相框">
      <div class="hero">
        <h1>你的主队，<em>印在照片上</em></h1>
        <p>选城市配色，挑一种款式，写上名字和号码。</p>
      </div>

      <h2 class="label"><span>01</span> 选主队</h2>
      <div class="groups" id="groups" role="tablist" aria-label="主题分组"></div>
      <div class="teams" id="teams" role="radiogroup" aria-label="主队配色"></div>

      <h2 class="label"><span>02</span> 选款式</h2>
      <div class="styles" id="styles" role="radiogroup" aria-label="款式"></div>

      <h2 class="label"><span>03</span> 印上你的字</h2>
      <div class="fields">
        <label class="field name">
          <span>名字</span>
          <input id="name" maxlength="12" autocomplete="off" placeholder="HOME">
        </label>
        <label class="field number">
          <span>号码</span>
          <input id="number" maxlength="2" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
        </label>
      </div>
      <label class="field slogan">
        <span>口号</span>
        <input id="slogan" maxlength="16" autocomplete="off">
      </label>
      <div class="slogans" id="slogans"></div>

      <label class="toggle">
        <input type="checkbox" id="date">
        <span class="switch" aria-hidden="true"></span>
        <span>加日期 <small id="date-note">印上拍照那天</small></span>
      </label>
    </section>
  </main>

  <div class="bar">
    <div class="shell bar-inner">
      <label class="button secondary" for="file">
        <span id="pick-text">选照片</span>
        <input type="file" id="file" accept="image/*" hidden>
      </label>
      <button class="button primary" id="save" type="button">做好照片</button>
    </div>
  </div>

  <dialog id="result" aria-labelledby="result-title">
    <div class="result-inner">
      <h2 id="result-title">做好了</h2>
      <p id="result-hint">按住照片可以保存或发给朋友。</p>
      <img id="result-image" alt="做好的照片">
      <div class="result-actions">
        <a class="button primary" id="download" download>下载照片</a>
        <button class="button secondary" id="share" type="button" hidden>分享</button>
        <button class="button ghost" id="close" type="button">关闭</button>
      </div>
    </div>
  </dialog>
</body>
</html>
